# Professional settings optimized for both Cloud and Low-RAM PCs
# Increased Metaspace to 512M to prevent the "Metaspace" crash seen in Cloud Builds
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

# Modern Android settings
android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
